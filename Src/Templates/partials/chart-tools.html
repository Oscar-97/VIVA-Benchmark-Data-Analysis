<div id="chartTools" class="chart-tools" hidden>
      <button
        id="resetZoomButton"
        class="btn btn-dark btn-sm"
        type="button"
        title="Show the whole chart again."
        disabled
      >
        <i class="bi bi-zoom-out"></i> Reset Zoom
      </button>
      <button
        id="showAllSeriesButton"
        class="btn btn-dark btn-sm"
        type="button"
        title="Show all data sets of the chart."
      >
        <i class="bi bi-eye"></i> Show All
      </button>
      <button
        id="hideAllSeriesButton"
        class="btn btn-dark btn-sm"
        type="button"
        title="Hide all data sets of the chart, to show only the ones you pick in the legend."
      >
        <i class="bi bi-eye-slash"></i> Hide All
      </button>
      <button
        id="downloadChartImageButton"
        class="btn btn-dark btn-sm"
        type="button"
        title="Download the chart as an image."
      >
        <i class="bi bi-file-earmark-image"></i> Download Image
      </button>
      <span
        id="chartToolsStatus"
        class="chart-tools-status"
        role="status"
      ></span>
    </div>
