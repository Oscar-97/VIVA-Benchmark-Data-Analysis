<div id="chartTools" class="chart-tools" hidden>
      <button
        id="resetZoomButton"
        class="btn btn-dark btn-sm"
        type="button"
        title="Show the whole chart again."
        disabled
      >
        <i class="bi bi-zoom-out"></i> Reset Zoom
      </button>
      <button
        id="showAllSeriesButton"
        class="btn btn-dark btn-sm"
        type="button"
        title="Show all data sets of the chart."
      >
        <i class="bi bi-eye"></i> Show All
      </button>
      <button
        id="hideAllSeriesButton"
        class="btn btn-dark btn-sm"
        type="button"
        title="Hide all data sets of the chart, to show only the ones you pick in the legend."
      >
        <i class="bi bi-eye-slash"></i> Hide All
      </button>
      <button
        id="chartTableToggleButton"
        class="btn btn-dark btn-sm"
        type="button"
        aria-expanded="false"
        aria-controls="chartDataTableContainer"
        title="Show the values of the chart as a table."
      >
        <i class="bi bi-table"></i> Show as table
      </button>
      <button
        id="downloadChartImageButton"
        class="btn btn-dark btn-sm"
        type="button"
        title="Download the chart as an image."
      >
        <i class="bi bi-file-earmark-image"></i> Download Image
      </button>
      <label class="visually-hidden" for="chartImageResolution"
        >Size of the image</label
      >
      <select
        id="chartImageResolution"
        class="form-select form-select-sm w-auto"
        title="The size of the downloaded image. A larger image is drawn again at a higher resolution, for print."
      >
        <option value="1" selected>Standard size (1×)</option>
        <option value="2">Print size (2×)</option>
        <option value="3">Large (3×)</option>
      </select>
      <label class="visually-hidden" for="chartImageBackground"
        >Background of the image</label
      >
      <select
        id="chartImageBackground"
        class="form-select form-select-sm w-auto"
        title="The background of the downloaded image."
      >
        <option value="page" selected>Page background</option>
        <option value="transparent">Transparent background</option>
      </select>
      <span
        id="chartToolsStatus"
        class="chart-tools-status"
        role="status"
      ></span>
    </div>
