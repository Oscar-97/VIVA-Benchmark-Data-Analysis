<div
      class="d-flex flex-wrap justify-content-start gap-2"
      style="margin-left: 1rem; margin-top: 1rem"
    >
      <div class="col-auto">
        <div class="input-group mb-1">
          <div class="form-floating">
            <select
              class="form-control form-control-sm"
              id="terminationTypeSelector"
              aria-label="terminationType"
            >
              <option value="1">Normal Completion</option>
              <option value="2">Iteration Interrupt</option>
              <option value="3">Resource Interrupt</option>
              <option value="4">Terminated By Solver</option>
              <option value="5">Evaluation Interrupt</option>
              <option value="6">Capability Problems</option>
              <option value="7">Licensing Problems</option>
              <option value="8">User Interrupt</option>
              <option value="9">Error Setup Failure</option>
              <option value="10">Error Solver Failure</option>
              <option value="11">Error Internal Solver Failure</option>
              <option value="12">Solve Processing Skipped</option>
              <option value="13">Error System Failure</option>
            </select>
            <label for="terminationTypeSelector">Termination Status</label>
          </div>
        </div>
      </div>
      <div class="col-auto">
        <div class="input-group mb-1">
          <div class="form-floating">
            <input
              type="number"
              class="form-control form-control-sm"
              placeholder="Enter a defaultTime."
              aria-label="Input direct default time"
              aria-describedby="basic-addon1"
              min="1"
              id="defaultTimeDirectInput"
            />
            <label for="gapLimitDirectInput">defaultTime</label>
          </div>
          <span class="input-group-text" style="font-size: small">s</span>
        </div>
      </div>
      <div class="col-auto">
        <div class="input-group mb-1">
          <div class="form-floating">
            <input
              type="number"
              class="form-control form-control-sm"
              placeholder="Enter a primal gap"
              aria-label="Input direct gap limit"
              aria-describedby="basic-addon1"
              min="0"
              step="0.01"
              id="gapLimitDirectInput"
            />
            <label for="gapLimitDirectInput">gapLimit</label>
          </div>
          <span class="input-group-text" style="font-size: small">%</span>
        </div>
      </div>
      <div class="col-auto">
        <div class="input-group mb-1">
          <div class="form-floating">
            <select
              class="form-control form-control-sm"
              id="gapTypeSelector"
              aria-label="gapType"
            >
              <option value="PrimalGap">Primal Gap</option>
              <option value="DualGap">Dual Gap</option>
              <option value="Gap_Solver">Solver Gap</option>
            </select>
            <label for="gapTypeSelector">Gap Type</label>
          </div>
        </div>
      </div>
    </div>

    <div
      class="d-flex flex-wrap justify-content-start gap-2"
      style="margin-left: 1rem; margin-top: 1rem"
    >
      <div class="col-auto">
        <div class="input-group mb-1">
          <div class="input-group mb-1" id="solverOptions">
            <!-- Checkboxes will be added here dynamically -->
          </div>
        </div>
      </div>
    </div>
