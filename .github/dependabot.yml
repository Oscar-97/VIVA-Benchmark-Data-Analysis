version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The extensions need the same major version of the DataTables core, so they are updated together.
      datatables:
        patterns:
          - "datatables.net*"
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
